name: Deploy wedding site to GitHub Pages

# Publishes wedding-site/ to GitHub Pages.
on:
  push:
    branches:
      - claude/trusting-bell-7jiqdp
    paths:
      - "wedding-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload wedding-site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wedding-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
